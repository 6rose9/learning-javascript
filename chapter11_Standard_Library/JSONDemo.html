<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>

<body>
    <script>
        let obj = {
            name: "Zin Zin",
            age: 30,
            username: "zin_zin",
            items: [1, 2, 2],
            _private: "Secret",
            
            display() {
                console.log('Name ', this.name);
                console.log('Age ', this.age);
            },

            // call while stringify
            toJSON() {
                return {
                    name: this.name,
                    age: this.age,
                    specialName: this.username
                }
            }
        }

        let str = JSON.stringify(obj);
        console.log('Str ', str);

        let obj2 = JSON.parse(str, function (key, value) {
            if (key[0] == '_') {
                return undefined;
            }
            return value;
        });
        console.log('Obj2 ', obj2);

    </script>
</body>

</html>
