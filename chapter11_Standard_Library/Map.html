<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
</head>

<body>
    <div>
        <p>key => vaule</p>
        <p>key is unique</p>
        <p>old school way: use object before map</p>
    </div>

    <script>
        let map = new Map([
            ['id-1', 'Jhon'],
            ['id-2', 'Aung Aung'],
        ]);

        console.log('size ', map.size);
        map.set('id-3', 'Kyaw Kyaw');

        console.log();
        console.log('map ', map);
        console.log('size ', map.size);

        console.log('get id-1', map.get('id-1'));
        console.log('get id-4', map.get('id-4'));

        console.log('has id-1', map.has('id-1'));
        console.log('has id-4', map.has('id-4'));

        map.delete('id-1');
        console.log('map ', map);
        console.log('size ', map.size);

        // map.clear();
        // console.log('map' , map);

        console.log('Keys ', map.keys()); 
        console.log('Values ', map.values());
        console.log('Entries ', map.entries());

        // note: return MapIterator; not array

    </script>
</body>

</html>
