<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Expression</title>
</head>

<body>
    <script>
        let pattern = /^A/; // start with A and then anything
        console.log(`${pattern} Aba`, pattern.test('Aba'));
        console.log(`${pattern} aba`, pattern.test('aba'));
        console.log(`${pattern} A`, pattern.test('A'));

        pattern = /^Java/;
        console.log(`${pattern} Javascript`, pattern.test('Javascript'));

        pattern = /script$/; // start with anything and end script
        console.log(`${pattern} Javascript`, pattern.test('Javascript'));

        pattern = /[abc]/; // include a or b or c?
        console.log(`${pattern} area`, pattern.test('area'));
        console.log(`${pattern} bac`, pattern.test('bac'));
        console.log(`${pattern} cat`, pattern.test('cat'));

        pattern = /[^abc]/; // not include a or b or c?
        console.log(`${pattern} area`, pattern.test('area')); // ture because r doesn't include a,b,c
        console.log(`${pattern} bac`, pattern.test('bac'));
        console.log(`${pattern} cat`, pattern.test('cat'));

        pattern = /.$/; // any character except newline or another unicode line terminator
        console.log(`${pattern} hello`, pattern.test('hello')); // true
        console.log(`${pattern} hello \n`, pattern.test('hello\n'));

        pattern = /^\w/; // start with any ASCII word character a-zA-Z0-9_
        console.log(`${pattern} hello`, pattern.test('hello')); // true
        console.log(`${pattern} hello123`, pattern.test('hello123')); // true
        console.log(`${pattern} 123hello`, pattern.test('123hello')); // true
        console.log(`${pattern} he23llo`, pattern.test('he23llo')); // true
        console.log(`${pattern} he#llo`, pattern.test('he#llo')); // true
        console.log(`${pattern} #hello`, pattern.test('#hello')); // false

        pattern = /^\w+$/;
        console.log(`${pattern} hello`, pattern.test('hello')); // true
        console.log(`${pattern} hello123`, pattern.test('hello123')); // true
        console.log(`${pattern} 123hello`, pattern.test('123hello')); // true
        console.log(`${pattern} he23llo`, pattern.test('he23llo')); // true
        console.log(`${pattern} he#llo`, pattern.test('he#llo')); // false
        console.log(`${pattern} #hello`, pattern.test('#hello')); // false

        pattern = /^\W+$/;
        console.log(`${pattern} hello`, pattern.test('hello')); // false
        console.log(`${pattern} hello123`, pattern.test('hello123')); // false
        console.log(`${pattern} 123hello`, pattern.test('123hello')); // false
        console.log(`${pattern} he23llo`, pattern.test('he23llo')); // false
        console.log(`${pattern} he#llo`, pattern.test('he#llo')); // true
        console.log(`${pattern} #hello`, pattern.test('#hello')); // true

        
    </script>
</body>

</html>
