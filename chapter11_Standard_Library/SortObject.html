<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Object</title>
</head>

<body>
    <script>
        let students = [
            {
                name: "Aung Aung",
                age: 40,
            },
            {
                name : "Mya Mya", 
                age: 30,
            },
            {
                name: "Aye Lwin",
                age: 23,
            },
            {
                name: "Khin Khin",
                age: 18,
            }, 
            {
                name: "Tin Win",
                age: 19
            }
        ];

        students.sort((a,b) => a.age - b.age);

        /*
            == 0
            > 1
            < -1
        */

        console.log('Students ', students);

    </script>
</body>

</html>
