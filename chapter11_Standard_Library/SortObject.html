<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Object</title>
</head>

<body>
    <script>
        let students = [
            {
                name: "Aung Aung",
                age: 30,
            },
            {
                name: "Mya Mya",
                age: 30,
            },
            {
                name: "Aye Lwin",
                age: 23,
            },
            {
                name: "Khin Khin",
                age: 19,
            },
            {
                name: "Tin Win",
                age: 19
            }
        ];

        students.sort((a, b) => {
            if (a.age == b.age) {
                return a.name.localeCompare(b.name);
            }
            else {
                return a.age - b.age;
            }
        });

        /*
            // ascending
            == 0  → keep original order (no change)
            < 0   → a comes before b
            > 0   → b comes before a
        */

        console.log('Students ', students);

    </script>
</body>

</html>
