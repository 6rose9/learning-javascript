<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Heap</title>
</head>
<body>
    <script>
        function hello(){
            let a = 10; // store -> stack memory
            let b = 20;
            let c = new Array(100_000); // store -> heap memory
            console.log('hello');
            another(); // store -> stack memory
        }

        function another(){
            console.log('Another');
        }

        hello();

    </script>
</body>
</html>
