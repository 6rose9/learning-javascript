<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Array</title>
</head>

<body>
    <script>
        let arr1 = new Array(100_100); // signed bytes
        let arr2 = new Int8Array(100_000); // unsigned bytes
        let buffer = new ArrayBuffer(1024 * 1024); // raw data - only byte - 0/1
        console.log(buffer.byteLength); // 1048576 (one megabyte of memory)

        let asInts = new Int32Array(buffer);
        let asByte = new Uint8Array(buffer);

        asInts[0] = 100;
        console.log('AsByte ', asByte[0]);


    </script>
</body>

</html>
