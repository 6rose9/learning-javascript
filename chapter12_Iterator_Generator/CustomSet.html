<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Set</title>
</head>

<body>
    <script>

        class MySet {
            unique = [];
            constructor(arr) {
                for (const item of arr) {
                    if (this.unique.indexOf(item) === -1) {
                        this.unique.push(item);
                    }
                }
            };

            get size() {
                return this.unique.length;
            }

            toString() {
                return `{ ${this.unique.join(',')}}`;
            }

            add(item) {
                if (this.unique.indexOf(item) === -1) {
                    this.unique.push(item);
                }
            }

            delete(item) {
                const index = this.unique.indexOf(item);
                if (index != -1) {
                    this.unique.splice(index, 1);
                }
            }

            has(item) {
                return this.unique.indexOf(item) !== -1;
            }

            clear() {
                this.unique = [];
            }

            // symbol
            [Symbol.iterator]() {
                let index = 0;
                let items = this.unique;
                return {
                    // method
                    next() {
                        return {
                            done: (index == items.length),
                            value: index < (items.length) ? items[index++] : undefined
                        }
                    }
                }
            }
        }

        let myset = new MySet([1, 2, 3, 4, 3, 2, 1]);
        console.log('Custom Set ', myset);
        console.log('Custom Set Size ', myset.size);
        console.log('Custom Set', myset.toString());

        myset.add(5);
        console.log('Add to custom set ', myset);
        console.log('Size ', myset.size);
        console.log('is there 5?', myset.has(5));

        // console.log('Clear custom set');
        // myset.clear();
        // console.log("After clear ", myset);

        for (const item of myset) {
            console.log(item);
        }

        iterator = myset[Symbol.iterator]();
        console.log(iterator.next());
        console.log(iterator.next());
        console.log(iterator.next());
        console.log(iterator.next());
        console.log(iterator.next());
        console.log(iterator.next());
        console.log(iterator.next());
    </script>
</body>

</html>
