<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>

<body>
    <script>
        class Range {

            constructor(from, to) {
                this.from = from;
                this.to = to;
            }

            // symbol
            [Symbol.iterator]() {
                let counter = this.from;
                let end = this.to;
                return {
                    // method
                    next() {
                        return {
                            done: !(counter <= end),
                            value: counter <= end ? counter++ : undefined
                        }
                    }
                }
            }
        }

        let range = new Range(1, 5);
        console.log(range);
        // let iterator = range[Symbol.iterator]();
        // console.log('Iterator ', iterator.next()); 

        for(const item of range){
            console.log('Item ', item);
        }

    </script>
</body>

</html>
