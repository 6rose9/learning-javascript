<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before fetch Web API</title>
</head>

<body>
    <script>
        // just for knowledge
        function beforeFetch(url) {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url);
            xhr.send();

            xhr.onload = function () {
                if (xhr.status != 200) {
                    alert(`Error ${xhr.status}: ${xhr.statusText}`);
                    return;
                }
                console.log('On Load ', xhr.responseText);
            }

            xhr.onerror = function (err) {
                console.log('On Error ', err);
            }

            // return new Promise((resolve, reject) => {
            //     xhr.onload = function () {
            //         if (xhr.status === 200) {
            //             resolve(xhr.response);
            //         } else {
            //             reject(xhr.status);
            //         }
            //     }
            // })
        }

        let result = beforeFetch(`https://dummyjson.com/todos/1`);
        console.log(result);

    </script>
</body>

</html>
