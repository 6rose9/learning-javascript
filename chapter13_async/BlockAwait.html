<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Await</title>
</head>

<body>
    <script>

        let url1 = "https://dummyjson.com/todos/1";
        let url2 = "https://dummyjson.com/todos/2";

        async function fetchTask() {
            console.log('started...');
            try {
                const res1 = await fetch(url1);
                const res2 = await fetch(url2);

                let data1 = await res1.json();
                let data2 = await res2.json();

                console.log([data1, data2]);

            } catch (error) {
                console.error(error);
            }
        }

        fetchTask();
        
    </script>
</body>

</html>
