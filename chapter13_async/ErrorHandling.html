<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Handling</title>
</head>
<body>
    <script>
        fetch('https://jsonplaceholder.typicode.com/todos/1')
        .then(response => response.json(), err => console.log('Fetch err ', err));
    </script>
</body>
</html>
