<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Await</title>
</head>

<body>
    <script>
        async function getTasks() {
            let url1 = "https://dummyjson.com/todos/1";
            let url2 = "https://dummyjson.com/todos/2";
            let url3 = "https://dummyjson.com/todos/3";

            let promises = [url1, url2, url3].map(url => fetch(url).then(res => res.json()));
            // for(const promise of promises){
            //     let data = await promise;
            //     console.log('Task', data);
            // }
            for await (const promise of promises) {
                console.log('Task', promise);
            }
        }

        getTasks();
    </script>
</body>

</html>
