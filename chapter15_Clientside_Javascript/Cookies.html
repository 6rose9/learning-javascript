<body>
    <div>
        <h3>Cookies</h3>
        <ul>
            <li><strong>HttpOnly Cookie (Server-set)</strong>
                – Cannot be accessed by JavaScript (e.g., document.cookie). Helps prevent XSS attacks.
            </li>
            <li><strong>Secure Cookie</strong> – Only sent over HTTPS connections.</li>
            <li><strong>Client-accessible Cookie</strong> – Can be read/written using document.cookie in the browser.</li>
        </ul>
    </div>

    </script>
</body>

</html>
