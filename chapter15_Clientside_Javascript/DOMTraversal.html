<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Traversal</title>
</head>

<body>
    <div id="container">
        Parent
        <div id="child">
            Child
        </div>
    </div>
    <div>Second div</div>
    <script>
        let container = document.getElementById('container');
        console.log('container ', container);
        console.log('container.parentNode ', container.parentNode);
        console.log('container.parentElement ', container.parentElement);
        console.log('container.childNodes ', container.childNodes);
        console.log('container.children ', container.children);
        console.log('container.firstChild ', container.firstChild);
        console.log('container.firstElementChild ', container.firstElementChild);
        console.log('container.lastChild', container.lastChild);
        console.log('container.lastElementChild', container.lastElementChild);
        console.log('container.nextSibling ', container.nextSibling);
        console.log('container.nextElementSibling', container.nextElementSibling);
        console.log('container.previousSibling ', container.previousSibling);
        console.log('container.previousElementSibling ', container.previousElementSibling);
    </script>
</body>

</html>
