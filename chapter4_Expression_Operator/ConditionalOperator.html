<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Operation</title>
</head>

<body>
    <script>
        let num = +window.prompt("Enter a number");
        console.log(num);

        // if(num % 2 == 0){
        //     console.log('Even number');
        // }else{
        //     console.log('Odd number');
        // }

        // ternary operator
        let result = (num % 2) ? "Even Number" : "Odd Number";
        console.log(result);

    </script>
</body>

</html>
