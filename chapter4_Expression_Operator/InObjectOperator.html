<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>in operator</title>
</head>

<body>
    <h3>in => is there property?</h3>
    <script>
        let obj = {
            name: 'Turning',
            age: 15
        };

        console.log('name in obj', 'name' in obj); // true
        console.log('toString in obj', 'toString' in obj); // true
        console.log('"another" in obj', 'another' in obj); // false

        let arr = [10, 20, 30];
        console.log('0 in arr ', 0 in arr); // true
        console.log('3 in arr ', 3 in arr); // false

    </script>
</body>

</html>
