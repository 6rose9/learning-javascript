<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instanceof operator</title>
</head>
<body>
    <script>
        let obj = {
            name: 'Turning',
            age: 15
        };

        console.log('obj instanceof Object? ', obj instanceof Object); // true
        console.log('obj instanceof Date Object? ', obj instanceof Date); // false

        let date = new Date();
        console.log('date instanceof Date ', date instanceof Date); // true
        console.log('data instanceof Object ', date instanceof Object); // true

        let arr = [1, 3, 5];
        console.log('arr instanceof Array', arr instanceof Array); // true
        console.log('arr instanceof Object', arr instanceof Object); // true
        console.log('arr instanceof Date', arr instanceof Date); // false

        console.log('null instanceof Object?', null instanceof Object); // false
        console.log('typeof null', typeof null);// object

    </script>
</body>
</html>
