<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <script>
        let obj = {
            valueOf() {
                return 3;
            }
        }

        ++obj;
        console.log('Obj ', obj); // 4
        console.log('typeof ', typeof obj); // number

        // ++2; Uncaught SyntaxError

        // let a = ++2; // Uncaught SyntaxError

        let a = 2;
        console.log(++a); // 3


    </script>
</body>

</html>
