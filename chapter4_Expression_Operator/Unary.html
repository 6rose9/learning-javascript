<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unary Operator</title>
</head>

<body>
    <script>
        // post increment
        let a = 10;
        let b = a++;
        console.log('a', a); // 11
        console.log('b', b); // do assignment operator first and then increment so b is 10

        // pre increment
        let c = 10;
        let d = ++c;
        console.log('c', c); // 11
        console.log('d', d); // 11
    </script>
</body>

</html>
