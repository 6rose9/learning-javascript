<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break Label</title>
</head>

<body>
    <script>
        outer: for (let i = 0; i < 5; i++) {
            console.log('Outer ===> ', i);
            for (let j = 0; j < 3; j++) {
                if (j == 2) {
                    break outer;
                }
            }
        }
        console.log('End of loop');
    </script>
</body>

</html>
