<html>

<head>
    <title>Control Statement</title>
</head>

<body>
    <script>
        let obj = {
            x: 10,
            y: 23,
            z: 39
        };

        for (const key in obj) { // for(const key of Object.keys(obj))
            console.log('Key', key, ' Value ', obj[key]);
        }

        let arr = [10, 20, 30];
        for (const index in arr) {
            console.log('Array ', arr[index]);
        }

    </script>
</body>

</html>
