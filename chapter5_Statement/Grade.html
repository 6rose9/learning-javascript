<html>

<head>
    <title>Conditional Statement</title>
</head>

<body>
    <script>
        let mark = +window.prompt("Enter your mark");
        if (mark < 40) console.log("D");
        else if (mark <= 60) console.log("C");
        else if (mark <= 80) console.log("B");
        else if (mark <= 100) console.log("A");
        else console.log("Invalid value");
    </script>
</body>

</html>
