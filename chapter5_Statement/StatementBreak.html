<html>

<head>
    <title>Jump Statement</title>
</head>

<body>
    <script>
        let i;
        for (i = 0; i < 10; i++) {
            if (i === 4) {
                break;
            }
            console.log('Loop ', i); // 0, 1, 2, 3
        }
        console.log("After break", i); // 4
    </script>
</body>

</html>
