<html>
    <head>
        <title>Control Statement - Looping</title>
    </head>
    <body>
        <script>
            let i = 0;
            let j = +window.prompt("Enter a number for looping ");
            while(i < j){
                console.log("Loop ", i);
                i++;
            }
            console.log("End of loop", i);
        </script>
    </body>
</html>
