<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serialization</title>
</head>

<body>
    <script>
        let obj = {
            name: 'Jhon',
            age: 45,
            address: 'Yangon',
            items: [1, 2, 3],

            // method doesn't include while serialization
            display() {
                console.log('Name ', this.name);
                console.log('Age ', this.age);
                console.log('Address ', this.address);
            }
        };

        // serialization
        let str = JSON.stringify(obj);
        console.log('Str ', str);

        // deserialization
        let obj2 = JSON.parse(str);
        console.log('Obj2 ', obj2);
        // obj2.items.push(100);

        console.log(`Obj.items`, obj.items); // [1,2,3]
        console.log(`Obj2 items`, obj2.items); // [1,2,3,100]

        // shallow clone
        let clone = { ...obj };
        console.log('Clone Obj', clone);
        console.log('Origin Obj', obj);

        console.log('Origin Obj and Clone Obj is same?');
        console.log(obj === clone); // false

        // deep clone
        console.log('Origin Obj and  Deserialized Obj is same?');
        console.log(obj == obj2); // false

        // Note:: (shallow clone, deep clone) store at difference memory address

        // assign by reference
        let a = { a: 1 };
        let aa = a;

        console.log('object assigned by reference is same ?')
        console.log(a === aa); // true

    </script>
</body>

</html>
