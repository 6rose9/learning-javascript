<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Methods</title>
</head>

<body>
    <script>

        let obj = {
            name: 'Jhon',
            age: 45,
            address: 'Yangon',
            items: [1, 2, 3],

            display() {
                console.log('Name ', this.name);
                console.log('Age ', this.age);
                console.log('Address ', this.address);
            }
        };
    </script>
</body>

</html>
