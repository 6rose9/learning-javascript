<html>

<script>

    function hello() {
        console.log("Hello.name", hello.name);
        console.log("Hello.length", hello.length);
        console.log("Hello.prototype", hello.prototype);
    }

    hello();

    function add(x,y){
        console.log("Argument Length " , arguments.length);
        if(arguments.length != 2){
            console.log('Invalid number of arguments');
            return;
        }

        return x + y;
    }

    console.log("add(19) => " , add(19), ", Parameter length is" , add.length);
    console.log("add(20, 56) => " , add(20,56), ", Parameter length is" , add.length);

</script>

</html>
