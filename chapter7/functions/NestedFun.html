<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Function</title>
</head>

<body>
    <script>
        function outer() {
            console.log('Inside outer');

            let counter = 10;

            function inner() {
                console.log('Inside inner', counter);
            }

            inner();
        }

        outer();
    </script>
</body>

</html>
