<html>
<script>
    let arr = [10, 20, -4, 40, 30];
    console.log('Array min ', Math.min(...arr));

    // Math.min accept number parameter, 
    // if one of them not number => NaN.
    // without parameter => inifinity
    console.log("Array min", Math.min(arr));
    console.log("Array min", Math.min());
    console.log(typeof Infinity);
</script>
