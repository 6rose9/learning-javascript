<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Constructor</title>
</head>

<body>
    <script>
        // create an empty array by using constructor
        let arr = new Array(); // let arr = [];
        console.log("Array is ", arr);

        let arr2 = new Array(5);
        console.log("Array size", arr2);

        let arr3 = new Array(5, 10, 15);
        console.log("Array 3 is", arr3);

        let arr4 = Array.of();
        console.log("Array of", arr4); // []

        let arr5 = Array.of(5, 10);
        console.log("Array of ", arr5); // [5, 10]

        let arr6 = Array.apply(arr5);
        console.log("Array 6 is ", arr6);

        // Sparse Arrays
        let sparseArray = [10, 20, 50, 64];
        sparseArray.length = 10;
        sparseArray[9] = 90;
        console.log("Sparse Array", sparseArray); // [0:10, 1:20, 3:50, 4:64, 9:90]
    </script>
</body>

</html>
