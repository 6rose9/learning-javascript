<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Method</title>
</head>

<body>
    <script>

        let arr = [];
        // --------------------------------------stack => first in last out / LIFO

        arr.push(20);
        arr.push(10);
        console.log(arr.pop()); //10
        arr[arr.length] = 70;
        arr.push(5, 10, 15);
        console.log(arr); // [20, 70, 5, 10, 15]

        // --------------------------------------queue => first in first out / FIFO

        arr.unshift(85);
        console.log(arr); //[85, 20, 70, 5, 10, 15]
        console.log(arr.shift()); // 85

        // -----------------------------------------------------------concat
        let arr2 = arr.concat([44, 55, 66]);
        console.log(arr2);
        console.log(arr); // inmutate

        // ------------------------------------------------------------slice
        // Creates a shallow copy of a portion of an array 
        // without modifying the original array.

        // arr.slice(startindex, endindex)
        let a = [1, 2, 3, 4, 5];
        console.log(a.slice(0, 3)); //[1,2,3]
        console.log(a.slice(3)); // [4,5]
        console.log(a.slice(1, -1)); // [2,3,4]
        console.log(a.slice(-3, -2)); // [3]
        console.log(a.slice(2, 3)); //[3]

        // ------------------------------------------------------------splice
        // mutate array

        let b = [2, 4, 6, 8, 10];
        let removed = b.splice(2, 2); // deletes 2 elements starting at index 2

        console.log("After splice:", b);        // [2, 4, 10]
        console.log("Removed elements:", removed); // [6, 8]

        let c = [1, 3, 5, 7, 9];
        let removedAdd = c.splice(2, 2, 11, 13, 15);
        console.log("After splice:", c); // [1,3,11,13,15,9]
        console.log("Removed elements:", removedAdd); //[5,7]

        // ------------------------------------------------------------ fill
        let d = new Array(5);
        d.fill(9);
        console.log("Fill Arrray ", d); // [9,9,9,9,9]

        let e = new Array(5);
        e.fill(8,2);
        console.log("Fill with 8 starting at index 2", e);// [empty,empty,8,8,8]

        let f = new Array(5);
        f.fill(8,2,-1);
        console.log("Fill with 8 at index 2 and 3", f); // [empty,empty,8,8,empty]

        // ------------------------------------------------------------ copyWithin
        // mutate array
        const array = ["a","b","c","d","e"];
        console.log(array.copyWithin(0,3,5));//['d', 'e', 'c', 'd', 'e']
        console.log("Origin array", array);//['d', 'e', 'c', 'd', 'e']
        
    </script>
</body>

</html>
