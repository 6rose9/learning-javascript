<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array to String</title>
</head>

<body>
    <script>
        let arr = [1, 2, 3];
        // let str = arr.join("-");
        // let str = arr.join(); //1,2,3
        let str = arr.join(" "); // 1 2 3
        console.log("Array to String ", str);

        let toString = arr.toString();
        console.log("Array.toString", toString);

        let toJsonString = JSON.stringify(arr);
        console.log("Array to stringify ", toJsonString);

        console.log('isArray ', Array.isArray(arr)); // true
        console.log('isArray {}', Array.isArray({})); // false
        console.log('is Array JSON string', Array.isArray(toJsonString)); //false

        let obj = {};
        obj[0] = 10;
        obj[1] = 20;
        obj.length = 2;

        console.log("is Array obj", Array.isArray(obj)); // false
        console.log(obj); // {0:10, 1: 20}

        let str2 = "Hello";
        console.log("Str2[0] ", str2[0]);
        console.log("Str2[1] ", str2[1]);
        console.log(typeof str2); // string

    </script>
</body>

</html>
