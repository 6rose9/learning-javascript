<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
</head>

<body>
    <script>
        let arr = [1, 3, 5, 7, 9];
        // should not use this way bcz array index is remaining
        console.log(arr);
        delete arr[1]; // 1 is index of array so delete 3
        console.log(arr); //[1, empty, 5, 7, 9]

        // recommanded way
        arr.splice(1, 2); // 1 is index, 2 is length
        console.log("Array after splice is ", arr); // [1, 7, 9]
        console.log("Length after splice is ", arr.length);

        console.log("-------------------------[10, 20, 30, 40, 50]-------------------------");

        let arr2 = [10, 20, 30, 40, 50];
        let itemsToDelete = [30, 40];

        let indexsToDelete = [];
        for (const item of itemsToDelete) {
            indexsToDelete.push(arr2.indexOf(item));
        }

        console.log("Indexes to delete ", indexsToDelete);

        // first delete larger index 
        indexsToDelete.reverse();

        for(const index of indexsToDelete){
            arr2.splice(index, 1);
        }

        // console.log("Array 2 after deletion without reverse ", arr2); //[10, 20, 40] bug
        console.log("Array 2 after deletion with reserve", arr2); // [10, 20, 50]
        
    </script>
</body>

</html>
