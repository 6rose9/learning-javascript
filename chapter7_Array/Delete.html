<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
</head>

<body>
    <script>
        let arr = [1, 3, 5, 7, 9];
        // should not use this way bcz array index is remaining
        console.log(arr);
        delete arr[1]; // 1 is index of array so delete 3
        console.log(arr); //[1, empty, 5]

        // recommanded way
        arr.splice(1,2); // 1 is index, 2 is length
        console.log("Array after splice is ", arr);
        console.log("Length after splice is ", arr.length);
    </script>
</body>

</html>
