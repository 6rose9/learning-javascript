<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iterate</title>
</head>

<body>
    <script>
        let arr = [1, 2, 3];

        for (let item of arr) {
            console.log("Item is ", item);
        }

        // for (const item of arr) {
        //     console.log("Item is ", item);
        //     item *= 2; // Uncaught TypeError
        // }

        console.log("Array after for...of ", arr);

        for (const [index, value] of arr.entries()) {
            console.log(`Index ${index} Value ${value}`);
            arr[index] = value * 2; // mutating the array, not reassigning index or value
            // value *= 2; // reassigning
        }

        console.log("Array after entries ", arr);

    </script>
</body>

</html>
