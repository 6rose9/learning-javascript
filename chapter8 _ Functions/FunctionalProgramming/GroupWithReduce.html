<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group with Reduce</title>
</head>

<body>
    <script>
        let students = [
            {
                name: 'Mya Mya',
                gender: 'Female',
                age: 20,
                city: 'YGN',
            },
            {
                name: 'Aung Hla',
                gender: 'Male',
                age: 15,
                city: 'YGN',
            },
            {
                name: 'Win Maung',
                gender: 'Male',
                age: 24,
                city: 'MDY',
            },
            {
                name: 'Tint Tint',
                gender: 'Female',
                age: 18,
                city: 'MDY',
            },
            {
                name: 'Mon Aung',
                gender: 'Male',
                age: 25,
                city: 'MON',
            },
            {
                name: 'Myo Aung',
                gender: 'Male',
                age: 27,
                city: 'MDY',
            },
            {
                name: 'Aye Aye',
                gender: 'Female',
                age: 28,
                city: 'MON',
            },
        ];

        /*
        group = {
            'Female': [{},{}],
            'Male': [{},{}]
            }
        */

        let group = {};

        // Imperative
        for (const student of students) {
            if (!group[student.gender]) {
                group[student.gender] = [student];
            } else {
                group[student.gender].push(student);
            }
        }

        console.log(group);

        // Declarative
        let group2 = students.reduce((group, student) => {
            if (!group[student.gender]) {
                return { // object
                    ...group,
                    [student.gender]: [student]
                }
            } else {
                return {
                    ...group,
                    [student.gender]: [...group[student.gender], student]
                }
            }
        }, {}); // {} empty object will be initial(group)
        console.log('Group2 ', group2);

        // pure function version ( no side effect)
        function groupBy(arr, property) {
            /*
            reduce() is used to turn an array into a single value.
            In this case, the students array into an object grouped by gender.
            group = {
                'YGN': [{},{}],
                'MDY': [{},{}]
            }
            */
            return arr.reduce((group, item) => {
                let fieldName = item[property];
                if (!group[fieldName]) {
                    return {
                        ...group,
                        [fieldName]: [item]
                    }
                }
                else {
                    return {
                        ...group,
                        [fieldName]: [...group[fieldName], item]
                    }
                }
            }, {});
        }

        console.log('Group by city ', groupBy(students, 'city'));
        console.log('Group by gender ', groupBy(students, 'gender'));

    </script>
</body>

</html>
