<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging</title>
</head>

<body>
    <script>
        function order() {
            console.log('Order business logic ');
        }

        function payment() {
            console.log('Processing business logic ');
        }

        // HOF
        function logging(fn) {
            return function (...args) {
                console.log('Function started ', fn.name);
                let result = fn(...args);
                console.log('Function ended ', fn.name);
                return result;
            }
        }

        let loggedOrder = logging(order);
        let loggedPayment = logging(payment);

        loggedOrder();
        loggedPayment();

    </script>
</body>

</html>
