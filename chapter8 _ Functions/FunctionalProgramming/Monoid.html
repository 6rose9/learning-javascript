<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monoid</title>
</head>

<body>
    <h3>Monoid</h3>
    <strong style="margin-left: 15px;">binary operation</strong>
    <div style="margin-left: 15px;padding: 15px;">
        <strong>associative</strong>
        <p>2 + 3 = 3 +2</p>
        <p>2 + 3 + 5 = 5 + (3 +2) = (3 + 5) + 2</p>
        <p> <strong>Associative operator + *</strong></p>
        <hr />

        <p> A + identity = A</p>
        <p> B + identity = B</p>
        <p><strong>Identity of addition(+) is 0</strong></p>
        <hr />

        <p> A * identity = A</p>
        <p> B * identity = B</p>
        <p><strong>Identity of multiplication(*) is 1</strong></p>
        <hr />
    </div>
    <script>
        let SumMonoid = {
            binaryOp: (x, y) => x + y,
            identity: () => 0
        };

        let MulMonoid = {
            binaryOp: (x, y) => x * y,
            identity: () => 1
        };

        // reduce
        function fold(monoid, arr) {
            return arr.reduce(monoid.binaryOp, monoid.identity());
        }

        let total = fold(SumMonoid, [1, 2, 3]);
        console.log('Total ', total);

        let product = fold(MulMonoid, [1, 3, 2]);
        console.log('Product ', product);

    </script>
</body>

</html>
