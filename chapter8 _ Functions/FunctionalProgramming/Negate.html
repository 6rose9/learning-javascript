<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negate</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4,5,6];

        // predicate function => return boolean
        let isEven = (x) => x%2 === 0;

        let evenList = arr.filter(isEven);
        console.log('Even List ', evenList);

        function not(fn){
            return function(x){
                return !fn(x);
            }
        }

        let isOdd = not(isEven);
        let oddList = arr.filter(isOdd);
        console.log('Odd List ', oddList);
        
    </script>
</body>
</html>
