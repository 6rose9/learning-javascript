<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Reduce</title>
</head>

<body>
    <script>
        let arr = [1, 2, 3, 4, 5, 6];

        // custom map function
        function map(arr, fn) {
            return arr.reduce((result, item) => {
                return [...result, fn(item)];
            }, [])
        }

        let arr2 = map(arr, item => item * 2);
        let arr3 = map(['a', 'b', 'c', 'd'], item => item + item);
        console.log('Arr ', arr);
        console.log('Arr 2', arr2);
        console.log('Arr 3', arr3);

        // custom filter function
        function filter(arr, fn) {
            return arr.reduce((result, item) => {
                if (fn(item)) {
                    return [...result, item];
                } else {
                    return result;
                }
            }, []);
        }

        let evenList = filter(arr, item => item % 2 === 0);
        console.log('Even List ', evenList);

    </script>
</body>

</html>
