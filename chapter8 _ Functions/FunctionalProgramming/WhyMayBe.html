<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why may be?</title>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.31.3/ramda.min.js"></script>
    <script>
        const Container = (x) => ({
            map: (fn) => Container(fn(x)),
            valueOf: () => x
        });

        const MayBe = (x) => ({
            isEmpty() {
                // console.log(x);
                return x === null || x === undefined;
            },
            map(fn) {
                // console.log(this.isEmpty());
                return this.isEmpty() ? MayBe.of(null) : MayBe(fn(x));
            },
            valueOf: () => x
        });
        MayBe.of = MayBe;

        function toUpper(str) {
            return str.toUpperCase();
        }

        function appendHi(str) {
            return str + " hi";
        }

        let newFun = R.pipe(toUpper, appendHi);
        console.log('ToUpper ', newFun('input'));
        // console.log('ToUpper ', newFun(undefined));

        let result = MayBe.of('hello')
            .map(newFun);
        console.log('Result ', result.valueOf());

    </script>
</body>

</html>
