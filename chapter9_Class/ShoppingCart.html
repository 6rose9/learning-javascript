<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
</head>

<body>
    <div>
        <p>class -> factory</p>
        <p>object -> product</p>
    </div>
    <script>
        class Item {
            constructor(name, price, qty) {
                this.name = name;
                this.price = price;
                this.qty = qty;
            }

            toString() {
                return (`${this.name.padEnd(20)} ${this.price + "". padEnd(10)} ${this.qty + "" . padEnd(10)}`)
            }
        }

        class ShoppingCart {
            items = [];
            addItem(item) {
                this.items.push(item);
                console.log('Item added');
            }

            displayItems() {
                for (const item of this.items) {
                    console.log(item.toString())
                }
            }
        }

        let s1 = new ShoppingCart();
        s1.addItem({
            name: "Orange",
            price: 7,
            qty: 23,
        });

        console.log(s1);

        let s2 = new ShoppingCart();
        s2.addItem({
            name: "Apple",
            price: 5,
            qty: 13,
        });
        s2.addItem({
            name: "mango",
            price: 10,
            qty: 10,
        });

        let s3 = new ShoppingCart();
        s3.addItem(new Item('Pencil', 20, 4));
        s3.addItem(new Item("Ruler", 25, 6));
        s3.displayItems();

    </script>
</body>

</html>
